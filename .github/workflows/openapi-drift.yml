name: Monitor Maketou OpenAPI drift

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect OpenAPI drift
        id: drift
        shell: bash
        run: |
          set +e
          pnpm spec:check
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "detected=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$status" -eq 1 ]; then
            echo "detected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          exit "$status"

      - name: Synchronize vendored specification
        if: steps.drift.outputs.detected == 'true'
        id: sync
        shell: bash
        env:
          BRANCH: chore/sync-maketou-openapi
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH"; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

          pnpm spec:sync

          if git diff --quiet -- resources/openapi.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/openapi.yaml
          git commit -m "chore: sync Maketou OpenAPI specification"
          git push origin "HEAD:$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create synchronization pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/sync-maketou-openapi
        shell: bash
        run: |
          existing_pr=$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number')

          if [ -n "$existing_pr" ]; then
            echo "Open synchronization PR #$existing_pr already exists."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: sync Maketou OpenAPI specification" \
            --body "Maketou's published OpenAPI specification changed. Review this contract diff before deciding whether the SDK schemas, types, tests, or documentation need updates."
